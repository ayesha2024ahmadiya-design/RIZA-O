box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--navy:#8FB0FF;--navy-soft:#26335E;--gold-soft:#3A3220;--lav-soft:#32295A;--bg:#161A2E;--card:#1F2440;--ink:#EEF0FA;--muted:#B0B7D3;--line:#343B63;--hero1:#233063;--hero2:#33295E}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.6;padding-bottom:84px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2;margin:0 0 .5rem}
main{max-width:720px;margin:0 auto;padding:0 18px}
section{padding:30px 0}
h2{font-size:1.6rem;color:var(--navy)}
p{margin:0 0 .8rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top div{max-width:720px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:10px}
.top img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#fff}
.top b{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--navy)}
.top span{color:var(--muted);font-size:.85rem;margin-left:auto}
.hero{margin-top:18px;border-radius:24px;padding:26px 20px;text-align:center;background:linear-gradient(160deg,var(--hero1),var(--hero2));border:1px solid var(--line)}
.hero img{width:min(240px,66%);border-radius:20px;background:#fff;box-shadow:0 6px 22px rgba(47,85,181,.18)}
.hero h1{font-size:clamp(1.7rem,6vw,2.3rem);color:var(--navy);margin-top:16px}
.hero p{color:var(--muted);max-width:44ch;margin:0 auto 1.1rem}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--gold);margin:4px}
.btn.p{background:var(--gold);color:#2A2210}
.btn.s{color:var(--navy);border-color:var(--lav);background:var(--card)}
.btn:focus-visible,.tabs a:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.founder{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;border-left:6px solid var(--gold)}
.founder img{width:170px;height:170px;border-radius:50%;object-fit:cover;border:5px solid var(--lav);flex:none;margin:0 auto}
.founder div{flex:1 1 240px}
.founder h3{font-size:1.25rem}
.founder small{color:var(--navy);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card:nth-child(1){background:var(--navy-soft)}.card:nth-child(2){background:var(--gold-soft)}.card:nth-child(3){background:var(--lav-soft)}.card:nth-child(4){background:var(--card)}
.card h3{font-size:1.05rem;color:var(--navy)}.card p{font-size:.92rem;color:var(--muted);margin:0}
.ico{font-size:1.6rem;display:block;margin-bottom:4px}
.card:nth-child(5){background:var(--navy-soft)}.card:nth-child(6){background:var(--gold-soft)}
.fee{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lav);border-radius:18px;padding:14px 16px;margin-top:12px}
.fee b{color:var(--navy)}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:2.1rem;font-weight:700;color:#2A2210;background:linear-gradient(140deg,var(--gold),var(--lav))}
.staff{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.staff .card{text-align:center}
.pf{width:104px;height:104px;border-radius:50%;display:block;margin:0 auto 10px;border:4px solid var(--card);box-shadow:0 0 0 3px var(--lav)}
.ed{display:inline-block;background:var(--card);color:var(--navy);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700;margin:2px 0 8px}
.rev{font-size:.9rem;font-style:italic;color:var(--ink);margin:0;text-align:left;border-top:1px solid var(--line);padding-top:8px}
.rev small{display:block;font-style:normal;color:var(--muted);margin-top:4px}
.stars{color:#E3A71C;letter-spacing:2px;text-align:left}
.amts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.amts button{font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;border:2px solid var(--lav);background:var(--card);color:var(--navy);cursor:pointer}

#msg{min-height:1.6em;font-weight:700;color:var(--navy)}
form{display:grid;gap:10px}
input,textarea{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}

footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 30px}

.tabs a:hover{color:var(--navy)}

.top select{margin-inline-start:auto;font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:auto}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.box{border:2px solid var(--lav);border-radius:18px;padding:16px;text-align:center;background:var(--card);display:flex;flex-direction:column;gap:6px}

.bk{width:100%;border-radius:18px;margin-bottom:12px}

.row span:first-child{flex:1}.row input{width:74px;text-align:center}
.tot{font-size:1.2rem;font-weight:700;color:var(--navy);margin:12px 0}

.rev,.stars{text-align:start}
[dir=rtl] .founder{border-left:1px solid var(--line);border-right:6px solid var(--gold)}
